name: Bug report
description: Something in Yamori doesn't work as expected.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What you did, what you expected and what you saw instead. Screenshots help.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Yamori version
      placeholder: "0.22.0"
    validations:
      required: true
  - type: dropdown
    id: editor
    attributes:
      label: Editor
      options: [VS Code, Cursor, Other]
    validations:
      required: true
  - type: dropdown
    id: ai
    attributes:
      label: AI
      options: [Claude Code, Codex, Not set up yet]
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: macOS 26, Windows 11, Ubuntu 24.04…
  - type: textarea
    id: example
    attributes:
      label: Example code
      description: A small, non-private snippet that shows the problem, if it is about an explanation.
      render: text
