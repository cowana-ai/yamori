name: Feature request
description: An idea that would make code easier to understand with Yamori.
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: What is hard today?
      description: The moment when reading or understanding code is slow or confusing.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help?
